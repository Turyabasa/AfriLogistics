name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API compile and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile API and tests
        run: python -m compileall -q app tests
      - name: Run database-independent API tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_models.py

  docker-integration:
    name: PostgreSQL/PostGIS and Redis integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and run integration suite
        run: docker compose --profile integration up --build --abort-on-container-exit --exit-code-from integration-tests integration-tests
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile integration logs
      - name: Clean up containers
        if: always()
        run: docker compose --profile integration down -v

  driver-typecheck:
    name: React Native driver typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install driver dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check driver app
        run: npm run typecheck
